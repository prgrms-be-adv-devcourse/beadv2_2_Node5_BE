name: Member Service CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "member-service/**"
      - "common/**"
      - "config/**"
      - "discovery/**"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Permission to gradlew
        run: chmod +x ./gradlew

      - name: Gradle Build
        run: ./gradlew :member-service:build

      - name: Run Tests
        run: ./gradlew :member-service:test