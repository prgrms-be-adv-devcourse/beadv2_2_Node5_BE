name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      cloud_changed: ${{ steps.detect.outputs.cloud_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리를 가져와야 PR 이전 시점과 비교가 가능합니다.

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          
          ALL='["billing-service","catalog-service","member-service","order-service","settlement-service","shop-service","subscription-service"]'

          # 수동 실행 시 전체 배포
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "cloud_changed=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"service\":$ALL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "cloud_changed=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"service":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # cloud/common 중 하나라도 바뀌면 전체 배포
          if echo "$CHANGED" | grep -qE '^(common/|config/|discovery/|apigateway/)'; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "cloud_changed=true"  >> "$GITHUB_OUTPUT"
          echo "matrix={\"service\":$ALL}" >> "$GITHUB_OUTPUT"
          exit 0
          fi
  
          # 변경된 도메인 서비스 추출
          SVC_JSON=$(echo "$CHANGED" \
          | awk -F/ '{print $1}' \
          | sort -u \
          | grep -E '^(billing-service|catalog-service|member-service|order-service|settlement-service|shop-service|subscription-service)$' \
          | jq -R . | jq -s .)
          
          echo "cloud_changed=false" >> "$GITHUB_OUTPUT"
          
          if [ "$SVC_JSON" = "[]" ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          echo 'matrix={"service":[]}' >> "$GITHUB_OUTPUT"
          exit 0
          
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "matrix={\"service\":$SVC_JSON}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: build application and make jar file
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 종속성 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build bootJar
        run: ./gradlew :${{ matrix.service }}:bootJar

      # 도커 로그인
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 도커 이미지 build & push
      - name: Build & Push docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_REPO }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted  # EC2에서 직접 명령 실행
    needs: [detect, build-and-push]
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false # 한 서비스가 실패해도 다른 서비스 배포는 진행
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }} # 변경된 서비스만 배포 대상

    steps:
      - uses: actions/checkout@v4

      - name: Deploy & Zero-Downtime Rollout
        run: |
          # 1. 변경된 특정 서비스의 설정만 적용 (또는 전체 적용)
          kubectl apply -f k8s/${{ matrix.service }}.yaml
          
          # 2. latest 태그 사용 시 필수: 이미지 강제 갱신 및 무중단 배포 시작
          # Deployment 이름이 서비스명과 같다고 가정합니다.
          kubectl rollout restart deployment/${{ matrix.service }}

