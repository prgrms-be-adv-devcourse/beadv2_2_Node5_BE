name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
      domain_matrix: ${{ steps.detect.outputs.domain_matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      cloud_changed: ${{ steps.detect.outputs.cloud_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.ref }}
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. 환경 변수 로드 및 통합 목록 생성
          DOMAINS='${{ vars.DOMAIN_SERVICES }}'
          INFRA='${{ vars.INFRA_SERVICES }}'
          ALL=$(echo "$DOMAINS $INFRA" | jq -s -c '.[0] + .[1] | unique')
          INFRA_PATTERN=$(echo "$INFRA" | jq -r '. | join("|")')
          ALL_PATTERN=$(echo "$ALL" | jq -r '. | join("|")')
          
          # 2. 비교 대상 설정 (수동: dev...deploy / 자동: before..sha)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin develop deploy
            BASE="origin/develop"; HEAD="origin/deploy"
            DIFF_SPEC="$BASE..$HEAD" # 수동 배포 시 feat의 변경사항만 확인
          else
            BASE="${{ github.event.before }}"; HEAD="${{ github.sha }}"
            DIFF_SPEC="$BASE $HEAD" # 자동 배포 시 develop의 모든 변경사항 확인
          fi
          
          # 3. 변경 파일 및 서비스 추출
          CHANGED=$(git diff --name-only $DIFF_SPEC || echo "")
          
          # common이 변경되면 전체 서비스, 아니면 해당 디렉토리 서비스만 추출
          if echo "$CHANGED" | grep -qE "^((common|$INFRA_PATTERN)/)"; then
            BUILD_LIST="$ALL"
            DOMAIN_LIST="$DOMAINS"
            CLOUD_CHANGED="true"
          else
            BUILD_LIST=$(echo "$CHANGED" | awk -F/ '{print $1}' | sort -u | grep -E "^($ALL_PATTERN)$" | jq -R . | jq -s -c . || echo "[]")
            DOMAIN_LIST="$BUILD_LIST"
            CLOUD_CHANGED="false"
          fi
          
          # 4. 결과 출력
          HAS_CHANGES=$([ "$BUILD_LIST" != "[]" ] && echo "true" || echo "false")
          
          echo "$CHANGED"
          echo "Build Target List: $BUILD_LIST"
          echo "Has Changes: $HAS_CHANGES"
          
          echo "build_matrix={\"service\":$BUILD_LIST}" >> "$GITHUB_OUTPUT"
          echo "domain_matrix={\"service\":$DOMAIN_LIST}" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "cloud_changed=$CLOUD_CHANGED" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: build application and make jar file
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: ./gradlew :${{ matrix.service }}:bootJar

      # 도커 로그인
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 도커 이미지 build & push
      - name: Build & Push docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_REPO }}/${{ matrix.service }}:latest

  deploy-cloud:
    name: Deploy Cloud (config → discovery → apigateway)
    runs-on: self-hosted
    needs: [detect, build-and-push]
    if: needs.detect.outputs.cloud_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Core Infra
        run: |
          kubectl apply -f k8s/config-repo-configmap.yaml
          
          ENV_PATH="/home/ubuntu/env"
          for env_file in $ENV_PATH/.env.*; do
            [ -e "$env_file" ] || continue
            svc_name=$(basename "$env_file" | sed 's/^\.env\.//')
            kubectl create secret generic ${svc_name}-secret \
            --from-env-file="$env_file" \
            --dry-run=client -o yaml | kubectl apply -f -
          done

          for svc in config discovery apigateway; do
            kubectl apply -f k8s/$svc.yaml
            kubectl rollout restart deployment/$svc
            kubectl rollout status deployment/$svc --timeout=300s
          done

  deploy-domains:
    name: Deploy Domains
    runs-on: self-hosted
    needs: [detect, build-and-push, deploy-cloud]
    if: |
      always() && 
      needs.detect.outputs.has_changes == 'true' &&
      (needs.deploy-cloud.result == 'success' || needs.deploy-cloud.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect.outputs.domain_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy & Rollout
        run: |
          kubectl apply -f k8s/${{ matrix.service }}.yaml
          kubectl rollout restart deployment/${{ matrix.service }}
          kubectl rollout status deployment/${{ matrix.service }} --timeout=300s

