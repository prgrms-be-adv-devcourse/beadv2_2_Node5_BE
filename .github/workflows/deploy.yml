name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
      domain_matrix: ${{ steps.detect.outputs.domain_matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      cloud_changed: ${{ steps.detect.outputs.cloud_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. 환경 변수 로드 및 통합 목록 생성
          DOMAINS='${{ vars.DOMAIN_SERVICES }}'
          INFRA='${{ vars.INFRA_SERVICES }}'
          ALL=$(echo "$DOMAINS $INFRA" | jq -s -c '.[0] + .[1] | unique')
          ALL_PATTERN=$(echo "$ALL" | jq -r '. | join("|")')
          
          # infra 목록은 "문자열 리스트"로만 사용
          INFRA_LIST=$(echo "$INFRA" | jq -r '.[]')
          
          echo "ALL=$ALL"
          echo "INFRA_LIST=$INFRA_LIST"
          echo "ALL_PATTERN=$ALL_PATTERN"
          
          # 2. 비교 대상 설정
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin deploy develop
            DIFF_SPEC="origin/deploy..origin/develop"
          else
            DIFF_SPEC="${{ github.event.before }} ${{ github.sha }}"
          fi
          
          # 3. 변경 파일 목록
          CHANGED=$(git diff --name-only $DIFF_SPEC || true)
          
          # 4. infra / common 변경 여부 판별 (jq ❌)
          CLOUD_CHANGED="false"
          for infra in $INFRA_LIST common; do
            if echo "$CHANGED" | grep -q "^${infra}/"; then
              CLOUD_CHANGED="true"
              break
            fi
          done
          
          # 5. 빌드 대상 계산
          if [ "$CLOUD_CHANGED" = "true" ]; then
            BUILD_LIST="$ALL"
            DOMAIN_LIST="$DOMAINS"
          else
            BUILD_LIST=$(echo "$CHANGED" \
              | awk -F/ '{print $1}' \
              | sort -u \
              | grep -E "^($ALL_PATTERN)$" \
              | jq -R . | jq -s -c . || echo "[]")
            DOMAIN_LIST="$BUILD_LIST"
          fi
          
          HAS_CHANGES=$([ "$BUILD_LIST" != "[]" ] && echo "true" || echo "false")
          
          # 6. 출력
          echo "CHANGED:"
          echo "$CHANGED"
          echo "CLOUD_CHANGED=$CLOUD_CHANGED"
          echo "BUILD_LIST=$BUILD_LIST"
          
          echo "build_matrix={\"service\":$BUILD_LIST}" >> "$GITHUB_OUTPUT"
          echo "domain_matrix={\"service\":$DOMAIN_LIST}" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "cloud_changed=$CLOUD_CHANGED" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: build application and make jar file
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.detect.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: ./gradlew :${{ matrix.service }}:bootJar

      # 도커 로그인
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 도커 이미지 build & push
      - name: Build & Push docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_REPO }}/${{ matrix.service }}:latest

  deploy-cloud:
    name: Deploy Cloud (config → discovery → apigateway)
    runs-on: self-hosted
    needs: [detect, build-and-push]
    if: needs.detect.outputs.cloud_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Core Infra
        run: |
          kubectl apply -f k8s/configmaps/common-configmap.yaml
          kubectl apply -f k8s/cronjobs/
          
          ENV_PATH="/home/ubuntu/env"
          for env_file in $ENV_PATH/.env.*; do
            [ -e "$env_file" ] || continue
            svc_name=$(basename "$env_file" | sed 's/^\.env\.//')
            kubectl create secret generic ${svc_name}-secret \
            --from-env-file="$env_file" \
            --dry-run=client -o yaml | kubectl apply -f -
          done

          for svc in discovery apigateway; do
            kubectl apply -f k8s/services/$svc.yaml
            kubectl rollout restart deployment/$svc
            kubectl rollout status deployment/$svc --timeout=300s
          done

  deploy-domains:
    name: Deploy Domains
    runs-on: self-hosted
    needs: [detect, build-and-push, deploy-cloud]
    if: |
      always() && 
      needs.detect.outputs.has_changes == 'true' &&
      (needs.deploy-cloud.result == 'success' || needs.deploy-cloud.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect.outputs.domain_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy & Rollout
        run: |
          kubectl apply -f k8s/configmaps/common-configmap.yaml
          kubectl apply -f k8s/cronjobs/
          if [ -f k8s/configmaps/${{ matrix.service }}-configmap.yaml ]; then
            kubectl apply -f k8s/configmaps/${{ matrix.service }}-configmap.yaml
          fi
          kubectl apply -f k8s/services/${{ matrix.service }}.yaml
          kubectl rollout restart deployment/${{ matrix.service }}
          kubectl rollout status deployment/${{ matrix.service }} --timeout=300s

