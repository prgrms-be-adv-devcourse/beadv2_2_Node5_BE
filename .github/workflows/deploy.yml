name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    name: build application and make jar file
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [
          "apigateway",
          "billing-service",
          "catalog-service",
          "member-service",
          "order-service",
          "settlement-service",
          "shop-service",
          "subscription-service"
        ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 종속성 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build bootJar
        run: ./gradlew :${{ matrix.service }}:bootJar

      # 도커 로그인
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 도커 이미지 build & push
      - name: Build & Push docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_REPO }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Verify kubectl
        run: kubectl version --client

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/

