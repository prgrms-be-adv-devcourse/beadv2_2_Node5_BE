spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jackson:
    time-zone: Asia/Seoul
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: support
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        default-encoding: UTF-8
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    template:
      delivery-mode: persistent
    listener:
      simple:
        default-requeue-rejected: false
  kafka:
    # 1. 공통 설정: 카프카 클러스터 주소
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual

    # 2. Producer 설정 (메시지를 보내는 서비스: 예 - Order, Payment)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # 3. Consumer 설정 (메시지를 받는 서비스: 예 - Notification, Settlement)
    consumer:
      group-id: support-service # 서비스별 그룹 아이디
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest # 처음부터 읽을지(earliest) 마지막부터 읽을지(latest)
      enable-auto-commit: false # 오프셋 자동 커밋 여부
      properties:
        spring.json.trusted.packages: "com.node5.common.event"
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com/
      chat:
        options:
          model: gpt-4o-mini # OpenAI에서 지원하는 경량 4o 모델
          # 낮은 값(0.0~0.3): 답변이 더 일관되고 보수적임. 사실성/정확도가 중요하거나 포맷 준수(예: JSON 출력, 코드 생성)할 때 유리.
          # 중간 값(0.4~0.7): 적당한 변주를 허용하면서도 안정성을 유지. 안내/추천형 챗봇에 무난.
          # 높은 값(0.7~1.0): 더 창의적이고 다양하지만 일관성·사실성이 떨어질 수 있음. 아이디어 브레인스토밍이나 문구 생성 등에 사용.
          temperature: 0.6
          max-tokens: 256
kafka:
  topics:
    review-created: support-service.review-created.v1
    product-discontinued: catalog-service.product-discontinued.v1
api:
  v1: /api/v1

server:
  port: 8087
