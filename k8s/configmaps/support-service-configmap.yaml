apiVersion: v1
kind: ConfigMap
metadata:
  name: support-service-config
data:
  support-service.yaml: |
    spring:
      elasticsearch:
        uris: http://${ES_HOST}:9200
        connection-timeout: 1s
        socket-timeout: 3s
      datasource:
        url: ${SPRING_DATASOURCE_URL}
        driver-class-name: org.postgresql.Driver
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
      jackson:
        time-zone: Asia/Seoul
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: true
        properties:
          hibernate:
            default_schema: support
            format_sql: true
            jdbc:
              time_zone: Asia/Seoul
      mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
          mail:
            default-encoding: UTF-8
            smtp:
              auth: true
              starttls:
                enable: true
      rabbitmq:
        host: ${RABBITMQ_HOST}
        port: 5672
        username: ${RABBITMQ_USERNAME}
        password: ${RABBITMQ_PASSWORD}
        template:
          delivery-mode: persistent
        listener:
          simple:
            default-requeue-rejected: false
      data:
        redis:
          host: ${REDIS_HOST}
          port: 6379
      kafka:
        bootstrap-servers: ${KAFKA_HOST}:9092
        listener:
          ack-mode: manual
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        consumer:
          group-id: support-service
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          auto-offset-reset: latest
          enable-auto-commit: false
          properties:
            spring.json.trusted.packages: "com.node5.common.event"
      ai:
        openai:
          api-key: ${OPEN_AI_API_KEY}
          base-url: https://api.openai.com
          chat:
            options:
              model: gpt-4.1-nano
              max-completion-tokens: 512
              temperature: 1.0
          embedding:
            options:
              model: text-embedding-3-small
    kafka:
      topics:
        review-created: support-service.review-created.v1
        product-discontinued: catalog-service.product-discontinued.v1
        product-embedding: catalog-service.product-embedding.v1
        product-index: catalog-service.product-index.v1
        order-status-changed: order-service.order-status-changed.v1
        subscription-status-changed: order-service.subscription-status-changed.v1
        payment-send-email: payment-service.send-email-event.v1
    api:
      v1: /api/v1
    app:
      search:
        index:
          product: products
        reindex:
          page-size: 500
    server:
      port: 8087
