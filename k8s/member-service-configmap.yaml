apiVersion: v1
kind: ConfigMap
metadata:
  name: member-service-config
data:
  member-service.yaml: |
    spring:
      datasource:
        url: ${SPRING_DATASOURCE_URL}
        driver-class-name: org.postgresql.Driver
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
      jackson:
        time-zone: Asia/Seoul
      sql:
        init:
          mode: always
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: true
        properties:
          hibernate:
            default_schema: member
            format_sql: true
            jdbc:
              time_zone: Asia/Seoul
      mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
          mail:
            default-encoding: UTF-8
            smtp:
              auth: true
              starttls:
                enable: true
      data:
        redis:
          host: ${REDIS_HOST}
          port: 6379
      kafka:
        bootstrap-servers: ${KAFKA_HOST}:9092
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        consumer:
          group-id: member-service
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          auto-offset-reset: latest
          enable-auto-commit: false
          properties:
            spring.json.trusted.packages: "com.node5.common.event"
    
    api:
      v1: /api/v1
    
    management:
      endpoints:
        web:
          exposure:
            include: health
    
    server:
      port: 8081
    
    token:
      expiration:
        access: 3600000
        refresh: 604800000
    
    kakao:
      api:
        key: ${KAKAO_API_KEY}
    
    google:
      client:
        id: ${GOOGLE_CLIENT_ID}
        secret: ${GOOGLE_CLIENT_SECRET}
    
    naver:
      client:
        id: ${NAVER_CLIENT_ID}
        secret: ${NAVER_CLIENT_SECRET}
    
    kafka:
      topics:
        shop-deleted: member-service.shop-deleted.v1
        member-deleted: member-service.member-deleted.v1
