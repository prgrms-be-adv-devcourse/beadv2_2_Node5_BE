server:
  port: 8000

spring:
  application:
    name: apigateway
  config:
    import: optional:configserver:http://config-service:8888
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/catalog-service/**
              filters:
                - RewritePath=/catalog-service/(?<segment>.*), /$\{segment}
            #        - id: shop-service
            #          uri: lb://SHOP-SERVICE
            #          predicates:
            #            - Path=/shop-service/**
            #          filters:
            #            - RewritePath=/shop-service/(?<segment>.*), /$\{segment}
            - id: member-service
              uri: lb://MEMBER-SERVICE
              predicates:
                - Path=/member-service/**
              filters:
                - RewritePath=/member-service/(?<segment>.*), /$\{segment}
            - id: billing-service
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/billing-service/**
              filters:
                - RewritePath=/billing-service/(?<segment>.*), /$\{segment}
            - id: subscription-service
              uri: lb://SUBSCRIPTION-SERVICE
              predicates:
                - Path=/subscription-service/**
              filters:
                - RewritePath=/subscription-service/(?<segment>.*), /$\{segment}
          default-filters:
            - name: GlobalFilter
              args:
                preLogger: true
                postLogger: true
            - name: AuthenticationFilter
          discovery:
            locator:
              enabled: true


management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, info

info:
  app:
    name: Spring Cloud Gateway
    description: API 라우팅 및 보안, 모니터링/메트릭 등의 기능을 간단하고 효과적인 방법으로 제공
  swagger-ui: http://localhost:8000/webjars/swagger-ui/index.html?configUrl=/v3/api-docs/swagger-config
