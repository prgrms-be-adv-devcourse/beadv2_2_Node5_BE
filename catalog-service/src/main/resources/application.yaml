server:
  port: 0 # random port

spring:
  application:
    name: catalog-service
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: default
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 1s
    socket-timeout: 3s
  cloud:
    config:
      fail-fast: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: catalog-service-search
      properties:
        spring.json.trusted.packages: "com.node5.catalogservice.*"

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, info, prometheus

apigateway:
  host: http://localhost:8000

app:
  search:
    product-index-name: products
    kafka:
      topics:
        product-index: product-index-topic

  s3:
    bucket: myroutine-s3-bucket
    region: ap-northeast-2
    presigned-url-expiration-seconds: 600
