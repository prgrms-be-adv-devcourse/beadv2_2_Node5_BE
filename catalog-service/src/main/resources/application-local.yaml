spring:
  config:
    import: optional:configserver:http://localhost:8888

  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 1s
    socket-timeout: 3s

  cloud:
    config:
      fail-fast: true

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: catalog-service-search

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.node5.common.event,com.node5.catalogservice.*"

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, info, prometheus

apigateway:
  host: http://localhost:8000

shop-service:
  url: http://localhost:8085

app:
  kafka:
    topics:
      member-deleted: member-service.member-deleted.v1
      product-index: product-index
      product-embedding: ai-service.product-embedding.v1
      product-discontinued: catalog-service.product-discontinued.v1

  search:
    index:
      product: products

  s3:
    bucket: ${S3_BUCKET_NAME}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration-seconds: ${S3_PRESIGNED_EXPIRE:600}
