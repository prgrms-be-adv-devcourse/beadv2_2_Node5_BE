spring:
  config:
    import: optional:configserver:http://config-service:8888
  elasticsearch:
    uris: http://${ES_HOST}:9200
    connection-timeout: 1s
    socket-timeout: 3s
  cloud:
    config:
      fail-fast: true

apigateway:
  host: http://apigateway-service:8000

shop-service:
  url: http://shop-service:8085

app:
  search:
    index:
      product: products
    kafka:
      topics:
        product-index: product-index-topic

  s3:
    bucket: ${S3_BUCKET_NAME}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration-seconds: ${S3_PRESIGNED_EXPIRE:600}
