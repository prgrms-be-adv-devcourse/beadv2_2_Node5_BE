spring:
  cloud:
    config:
      enabled: false
      fail-fast: false
  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:catalog-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
api:
  v1: /api/v1

apigateway:
  host: http://localhost:8000

app:
  search:
    product-index-name: test_products
